schema_version: "1.1"
name: vide-contexte-trigger-save-before-clearing
tags: [trigger, should-fire]
execution:
  prompt: "Save context before clearing: persist whatever is non-obvious from this conversation to memory."
  allowed_tools: [Skill, Read, Glob, Grep]
  max_turns: 6
  timeout_seconds: 300
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vide-contexte"'
    min: 1
    arm: both
expected_outcome: 'English phrasing.'
