schema_version: "1.1"
name: ticket-no-trigger-issue-shell-only
tags: [trigger, should-not-fire]
execution:
  prompt: "Crée seulement l'issue, la branche et la MR vide pour cette tâche : ajouter un filtre par date sur la liste des relevés. N'implémente rien."
  allowed_tools: [Skill, Read, Glob, Grep]
  max_turns: 6
  timeout_seconds: 300
runs: 3
graders:
  - type: tool_used
    name: skill-not-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ticket"'
    min: 0
    max: 0
    arm: both
expected_outcome: 'Belongs to issue-mr: shell only, no delivery.'
